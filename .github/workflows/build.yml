
name: SonarQube Analysis

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  sonar:
    name: Analyze EV Charging Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests and generate coverage
        working-directory: frontend
        run: npm test -- --coverage

      - name: Verify coverage report
        run: |
          test -f frontend/coverage/lcov.info || (echo "Coverage report not found: frontend/coverage/lcov.info" && exit 1)

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.sources=frontend/src,backend/app
            -Dsonar.tests=backend
            -Dsonar.test.inclusions=backend/**/*.py,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/**/*.spec.ts,frontend/src/**/*.spec.tsx
            -Dsonar.exclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/**/*.spec.ts,frontend/src/**/*.spec.tsx,frontend/src/test/**,frontend/src/main.tsx,frontend/src/vite-env.d.ts,backend/.venv/**
            -Dsonar.coverage.exclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/**/*.spec.ts,frontend/src/**/*.spec.tsx,frontend/src/test/**,backend/tests/**
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
